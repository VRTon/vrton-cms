<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>VRTon</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('vrton-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#12100f' : '#ffffff');
          }

          var raw = window.localStorage.getItem('vrton-accessibility');
          var textSize = 'normal';
          try {
            if (raw === 'on') {
              textSize = 'large';
            } else if (raw && raw !== 'off') {
              var parsed = JSON.parse(raw);
              if (parsed && (parsed.textSize === 'large' || parsed.textSize === 'xlarge')) {
                textSize = parsed.textSize;
              }
            }
          } catch (e) {
            textSize = 'normal';
          }
          document.documentElement.setAttribute('data-a11y-text-size', textSize);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
